# Dear Muse: Soul Drift — iOS 17 / Swift 6
name: DearMuse
options:
  bundleIdPrefix: com.s2
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: XN42ZWWAT9
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  DearMuse:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: CoreEngines
      - path: Views
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: DearMuse
        PRODUCT_BUNDLE_IDENTIFIER: com.s2.dearmuse
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Dear Muse
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
        CODE_SIGN_ENTITLEMENTS: Config/DearMuse.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_TESTABILITY: YES

  DearMuseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DearMuseTests
    dependencies:
      - target: DearMuse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.s2.dearmuse.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DearMuse.app/DearMuse"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  DearMuse:
    build:
      targets:
        DearMuse: all
        DearMuseTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Config/DearMuseMembership.storekit
    test:
      config: Debug
      targets:
        - DearMuseTests
    archive:
      config: Release
